<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青岛公司发现 - 高德地图</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231677ff'/><path d='M32 12 C22 12 14 20 14 30 C14 42 32 56 32 56 C32 56 50 42 50 30 C50 20 42 12 32 12 Z M32 36 C28.7 36 26 33.3 26 30 C26 26.7 28.7 24 32 24 C35.3 24 38 26.7 38 30 C38 33.3 35.3 36 32 36 Z' fill='white'/><rect x='20' y='48' width='24' height='4' rx='2' fill='white' opacity='0.8'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c-primary:#1677ff; --c-green:#52c41a; --c-amber:#fa8c16; --c-red:#ff4d4f;
  --c-bg:#f0f2f5; --c-surface:rgba(255,255,255,.88); --c-border:#e8e8e8;
  --c-text:#1a1a2e; --c-text2:#666; --c-text3:#999;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow-panel:0 8px 32px rgba(0,0,0,.08); --shadow-card:0 2px 8px rgba(0,0,0,.04);
  --font:'-apple-system','Microsoft YaHei',sans-serif;
  --transition:.2s ease;
}
body{font-family:var(--font);overflow:hidden;background:var(--c-bg)}
#map{width:100vw;height:100vh}

/* ===== 顶栏胶囊 ===== */
#bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--c-surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:28px;box-shadow:var(--shadow-panel);font-size:12px;
  display:flex;align-items:center;gap:6px;padding:5px 8px}
#bar .seg{display:flex;background:#f5f5f5;border-radius:20px;padding:2px}
#bar .seg button{padding:5px 12px;border:none;border-radius:18px;font-size:11px;
  cursor:pointer;font-weight:500;background:transparent;color:var(--c-text2);transition:var(--transition)}
#bar .seg button.on{background:#fff;color:var(--c-primary);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
#bar .btn-dist{position:relative;padding:5px 10px;border:1.5px solid var(--c-border);border-radius:18px;
  font-size:11px;cursor:pointer;background:#fff;color:var(--c-text2);transition:var(--transition)}
#bar .btn-dist.on{border-color:var(--c-primary);color:var(--c-primary);background:#f0f5ff}
#bar .btn-go{padding:6px 18px;border:none;border-radius:20px;font-size:13px;font-weight:600;
  cursor:pointer;background:var(--c-primary);color:#fff;transition:var(--transition);min-width:80px}
#bar .btn-go:hover{opacity:.9;transform:translateY(-1px)}
#bar .btn-go.busy{background:var(--c-amber);pointer-events:none;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#bar .btn-cancel{display:none;padding:5px 12px;border:none;border-radius:18px;font-size:11px;
  cursor:pointer;background:var(--c-red);color:#fff}
#bar .sep{width:1px;height:20px;background:var(--c-border);margin:0 2px}
#bar .btn-icon{padding:5px 8px;border:1.5px solid var(--c-border);border-radius:18px;
  font-size:11px;cursor:pointer;background:#fff;color:var(--c-text2);transition:var(--transition);white-space:nowrap}
#bar .btn-icon:hover{border-color:var(--c-primary);color:var(--c-primary)}
#bar .btn-icon.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
#bar .btn-icon.amber{border-color:var(--c-amber);color:var(--c-amber)}
#bar .btn-icon.amber:hover{background:var(--c-amber);color:#fff}
#bar .more-wrap{position:relative}
#bar .more-drop{display:none;position:absolute;top:100%;right:0;margin-top:6px;
  background:#fff;border:1px solid var(--c-border);border-radius:var(--r-md);
  box-shadow:var(--shadow-panel);padding:6px 0;min-width:130px;z-index:300}
#bar .more-drop button{display:block;width:100%;padding:7px 14px;border:none;background:none;
  font-size:11px;cursor:pointer;text-align:left;color:var(--c-text2);transition:var(--transition)}
#bar .more-drop button:hover{background:#f0f5ff;color:var(--c-primary)}
#bar .more-wrap:hover .more-drop{display:block}
#bar .badge{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
  background:var(--c-red);color:#fff;border-radius:8px;font-size:10px;padding:0 4px;margin-left:-2px}

/* ===== 区下拉 ===== */
#distDrop{display:none;position:absolute;top:100%;left:0;margin-top:6px;
  background:#fff;border:1px solid var(--c-border);border-radius:var(--r-md);padding:8px 0;
  box-shadow:var(--shadow-panel);min-width:160px;z-index:300}
#distDrop label{display:block;padding:6px 16px;cursor:pointer;font-size:12px;white-space:nowrap}
#distDrop label:hover{background:#f0f5ff}
#distDrop input{margin-right:6px}
#distDrop .act{display:flex;gap:4px;padding:4px 16px;border-top:1px solid #f0f0f0;margin-top:4px;padding-top:8px}
#distDrop .act button{font-size:11px;padding:3px 8px;background:#f5f5f5;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer}

/* ===== Toast ===== */
#toast{position:absolute;bottom:24px;left:24px;z-index:300;
  background:var(--c-surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--c-text);padding:10px 20px;border-radius:var(--r-md);
  box-shadow:var(--shadow-panel);font-size:13px;pointer-events:none;
  opacity:0;transition:opacity .3s ease;max-width:60vw}
#toast.show{opacity:1}
#drawHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:199;
  background:rgba(22,119,255,.9);color:#fff;padding:16px 32px;
  border-radius:10px;font-size:16px;font-weight:bold;display:none;pointer-events:none}

/* ===== 结果面板 ===== */
#res{position:absolute;top:68px;right:12px;z-index:200;width:420px;
  max-height:calc(100vh - 90px);background:var(--c-surface);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid var(--c-border);
  border-radius:var(--r-lg);display:none;flex-direction:column;
  box-shadow:var(--shadow-panel);font-size:13px;color:var(--c-text);overflow:hidden}
#res .rh{padding:12px 16px;border-bottom:1px solid var(--c-border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
#res .rh .tabs{display:flex;gap:6px}
#res .rh .tabs span{padding:4px 10px;border-radius:14px;font-size:12px;cursor:pointer;transition:var(--transition);
  font-weight:500;user-select:none}
#res .rh .tabs span.on{color:#fff}
#res .rh .tabs .tab-hiring{color:var(--c-green)} #res .rh .tabs .tab-hiring.on{background:var(--c-green)}
#res .rh .tabs .tab-uncertain{color:var(--c-amber)} #res .rh .tabs .tab-uncertain.on{background:var(--c-amber)}
#res .rh .tabs .tab-all{color:var(--c-text3)} #res .rh .tabs .tab-all.on{background:var(--c-text3)}
#res .rh .ctl{display:flex;gap:4px}
#res .rh .ctl button{background:transparent;border:1px solid var(--c-border);border-radius:var(--r-sm);
  padding:3px 8px;cursor:pointer;font-size:11px;transition:var(--transition)}
#res .rh .ctl button.on{background:#f0f5ff;color:var(--c-primary);border-color:var(--c-primary)}
#res.mini{width:200px}#res.mini .rb,#res.mini .sortrow{display:none}

/* ===== 排序 + 进度 ===== */
.sortrow{padding:6px 12px;border-bottom:1px solid var(--c-border);display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.sortrow button{font-size:10px;padding:3px 10px;border-radius:12px;border:1px solid var(--c-border);
  background:#fafafa;cursor:pointer;transition:var(--transition)}
.sortrow button.on{background:var(--c-amber);color:#fff;border-color:var(--c-amber)}
.prog-wrap{padding:6px 12px;border-bottom:1px solid var(--c-border);flex-shrink:0;display:none}
.prog{background:#f0f0f0;border-radius:3px;height:4px}
.prog div{background:var(--c-primary);height:100%;border-radius:3px;width:0;transition:width .3s}
.pt{font-size:10px;color:var(--c-text3);margin-top:3px}

/* ===== 列表卡片 ===== */
.rb{overflow-y:auto;flex:1;padding:8px 12px}
.rrow{background:#fff;border:1px solid var(--c-border);border-left:4px solid transparent;
  border-radius:var(--r-md);padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:var(--transition);box-shadow:var(--shadow-card)}
.rrow:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.rrow.h{border-left-color:var(--c-green)}.rrow.u{border-left-color:var(--c-amber)}.rrow.n{border-left-color:#e0e0e0}
.rt{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.rn{font-weight:600;font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:13px;font-weight:700;padding:2px 8px;border-radius:10px}
.rs.h{background:#f6ffed;color:var(--c-green)}.rs.m{background:#fff7e6;color:var(--c-amber)}.rs.l{background:#fff1f0;color:var(--c-red)}
.rnatur{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:4px;font-weight:normal}
.nat-外资{background:#fff0f6;color:#c41d7f} .nat-合资{background:#fff7e6;color:#d46b08}
.nat-股份{background:#f6ffed;color:#389e0d} .nat-民营{background:#e6f7ff;color:#096dd9}
.nat-个体{background:#f5f5f5;color:#666}
.rm{display:flex;gap:8px;margin-bottom:3px;font-size:11px;color:var(--c-text2);flex-wrap:wrap}
.ra{font-size:11px;color:var(--c-text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rtag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.rtag.found{background:#f6ffed;color:var(--c-green);border:1px solid #b7eb8f}
.rtag.error{background:#fffbe6;color:var(--c-amber);border:1px solid #ffe58f}
.rd{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--c-border);font-size:11px;color:var(--c-text2)}
.rd table{width:100%;border-collapse:collapse}
.rd td{padding:3px 4px}.rd td:first-child{color:var(--c-text3);width:80px}
.rd a{color:var(--c-primary);text-decoration:none}.rd a:hover{text-decoration:underline}
.btn-save{background:none;border:none;font-size:16px;cursor:pointer;padding:0 4px;transition:var(--transition)}
.btn-save.on{color:#faad14}

/* ===== 翻页 ===== */
.pager{display:flex;align-items:center;justify-content:center;gap:3px;padding:10px 12px;
  border-top:1px solid var(--c-border);flex-shrink:0;flex-wrap:wrap}
.pager button{padding:4px 9px;border:1px solid var(--c-border);border-radius:var(--r-sm);
  background:#fff;font-size:11px;cursor:pointer;transition:var(--transition);min-width:28px}
.pager button.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pg-info{font-size:11px;color:var(--c-text3)}

/* ===== 收藏面板 ===== */
#savedPanel{position:absolute;top:68px;right:12px;z-index:210;width:380px;
  max-height:calc(100vh - 90px);background:#fff;border:1px solid var(--c-border);
  border-radius:var(--r-lg);display:none;flex-direction:column;box-shadow:var(--shadow-panel)}
#savedPanel .sh{padding:14px 16px;border-bottom:1px solid var(--c-border);
  display:flex;justify-content:space-between;align-items:center;font-size:14px}
#savedPanel .sh button{padding:4px 10px;border:1px solid var(--c-border);border-radius:var(--r-sm);
  background:#fafafa;font-size:11px;cursor:pointer}
#savedPanel .sb{overflow-y:auto;flex:1;padding:12px;font-size:13px}
#savedPanel .srow{background:#fafafa;border:1px solid #f0f0f0;border-radius:6px;padding:8px 10px;margin-bottom:4px}
#savedPanel .srow .rt{display:flex;justify-content:space-between;align-items:center}
#savedPanel .srow .rn{font-weight:bold;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#savedPanel .srow .ra{font-size:10px;color:#999;margin-top:2px}
#savedPanel .srow .op{display:flex;gap:6px;margin-top:4px}
#savedPanel .srow .op a{font-size:10px;text-decoration:none;font-weight:bold}
.empty{text-align:center;padding:30px;color:var(--c-text3);line-height:2}
</style>
</head>
<body>

<div id="map"></div>
<div id="drawHint">在地图上按住鼠标拖拽画范围</div>

<div id="bar">
  <!-- 搜索模式分段控件 -->
  <div class="seg">
    <button class="btn-mode on" data-mode="dist">行政区</button>
    <button class="btn-mode" data-mode="rect">拉框</button>
    <button class="btn-mode" data-mode="circle">画圆</button>
    <button class="btn-mode" data-mode="view">视野</button>
  </div>
  <!-- 区域选择 -->
  <div style="position:relative">
    <button class="btn-dist on" id="btnDist" onclick="event.stopPropagation();toggleDistDrop()">黄岛区 &#9662;</button>
    <div id="distDrop">
      <label><input type="checkbox" value="黄岛区" checked> 黄岛区</label>
      <label><input type="checkbox" value="市南区"> 市南区</label>
      <label><input type="checkbox" value="市北区"> 市北区</label>
      <label><input type="checkbox" value="李沧区"> 李沧区</label>
      <label><input type="checkbox" value="崂山区"> 崂山区</label>
      <label><input type="checkbox" value="城阳区"> 城阳区</label>
      <label><input type="checkbox" value="即墨区"> 即墨区</label>
      <label><input type="checkbox" value="胶州市"> 胶州市</label>
      <label><input type="checkbox" value="平度市"> 平度市</label>
      <label><input type="checkbox" value="莱西市"> 莱西市</label>
      <div class="act">
        <button id="btnSelAll">全选</button>
        <button id="btnSelNone">清空</button>
      </div>
    </div>
  </div>
  <!-- 主操作 -->
  <button class="btn-go" id="btnGo">开始搜索</button>
  <button class="btn-cancel" id="btnCancel">取消</button>
  <!-- 更多菜单 -->
  <div class="more-wrap">
    <button class="btn-icon">···</button>
    <div class="more-drop">
      <button id="btnJobCheck">查招聘状态</button>
      <button id="btnCsv" disabled>导出CSV</button>
      <button id="btnHome">回家</button>
      <button id="btnMarker" class="on">显示标记</button>
      <button id="btnMyList">我的名单</button>
    </div>
  </div>
</div>

<div id="res">
  <div class="rh">
    <div class="tabs">
      <span class="tab-hiring on" data-filter="hiring">0 家在招</span>
      <span class="tab-uncertain" data-filter="uncertain">0 家不明</span>
      <span class="tab-all" data-filter="all">全部 0 家</span>
    </div>
    <div class="ctl">
      <button id="btnList" class="on">列表</button>
      <button id="btnMapOnly">仅地图</button>
      <button id="resToggle">收起</button>
    </div>
  </div>
  <div class="sortrow" id="sortRow">
    <button class="on" data-s="total">综合排序</button>
    <button data-s="distanceScore">距离最近</button>
    <button data-s="scaleScore">规模最大</button>
    <button data-s="welfareScore">福利最好</button>
  </div>
  <div class="prog-wrap" id="progWrap">
    <div class="prog"><div id="progFill"></div></div>
    <div class="pt" id="progText"></div>
  </div>
  <div class="rb" id="resBody">
    <div id="resList"></div>
    <div id="pagination" style="display:none"></div>
  </div>
</div>

<div id="toast">提示：选"行政区"模式 + 勾选区域 → 点"开始搜索" | 右键设家 | Esc取消绘制</div>

<div id="savedPanel">
  <div class="sh">
    <strong>我的名单</strong>
    <div style="display:flex;gap:6px">
      <button id="btnExportSaved">导出CSV</button>
      <button id="btnClearSaved">清空</button>
      <button id="btnCloseSaved" style="background:#eee">✕</button>
    </div>
  </div>
  <div class="sb" id="savedBody"><div class="empty">还没有收藏公司<br>搜索结果中点击 ⭐ 收藏</div></div>
</div>

<script>
// 高德安全密钥（JS API 2.0 数据服务必需）
window._AMapSecurityConfig = { securityJsCode: '8c098a05e42da428b9fc42f2dbc47070' };
</script>

<script src="https://webapi.amap.com/maps?v=2.0&key=a3a3169723ae7b4ad9cafae574444664&plugin=AMap.Geocoder,AMap.MouseTool,AMap.DistrictSearch"></script>

<script>
// ============================================================
//  配置
// ============================================================
var HOME = '青岛黄岛区学院路288号';
var HLNG = 120.141, HLAT = 35.998;

// 关键词：用最宽泛的词覆盖所有公司类型
// 精简到最有效的15个关键词（公司负责全覆盖，其余补充行业漏网之鱼）
var KEYS = ['公司','科技','工程','制造','商贸','贸易','电子','食品','化工','机械','物流','医疗','教育','建筑','房产'];

var MATCH = ['科技','信息技术','网络','互联网','通信','电子','计算机','自动化',
  '数据','智能','新能源','制造','检测','软件','工程','生物','医药','物流',
  '教育','建筑','食品','化工','机械','新材料','环保','服装'];

// toast 替代 tip
var toastTimer = null;
function toast(msg, duration) {
  if (typeof duration === 'undefined') duration = 3000;
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  if (duration > 0) toastTimer = setTimeout(function() { el.classList.remove('show'); }, duration);
}

// 区下拉切换
function toggleDistDrop() {
  var dd = document.getElementById('distDrop');
  dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
}

// ============================================================
//  地图 & 家标记
// ============================================================
var map = new AMap.Map('map', {
  zoom: 12, center: [HLNG, HLAT], mapStyle: 'amap://styles/normal',
  dragEnable: true, scrollWheel: true, doubleClickZoom: true
});

var geocoder = new AMap.Geocoder({city: '青岛'});
geocoder.getLocation(HOME, function(s, r) {
  if (s === 'complete' && r.info === 'OK' && r.geocodes.length > 0) {
    HLNG = r.geocodes[0].location.lng;
    HLAT = r.geocodes[0].location.lat;
  }
  initHome();
});

var homeMarker = null, homeCircles = [];
function initHome() {
  homeMarker = new AMap.Marker({
    position: [HLNG, HLAT], title: HOME,
    label: { content: '我家', offset: new AMap.Pixel(0, -22) }
  });
  homeMarker.setMap(map);
  [5, 10, 15, 20, 30].forEach(function(r) {
    var c = new AMap.Circle({
      center: [HLNG, HLAT], radius: r * 1000, strokeColor: '#ddd',
      strokeWeight: 1, strokeOpacity: .6, fillOpacity: 0, strokeStyle: 'dashed'
    });
    c.setMap(map); homeCircles.push(c);
  });
}

// ============================================================
//  模式 & 状态
// ============================================================
var mode = 'dist';  // dist | rect | circle | view
var drawObj = null, drawBounds = null, drawCenter = null, drawRadius = 0;
var distPolygons = [];   // 行政区多边形
var distBoundsAll = null; // 合并后的行政区 bounds
var homeDist = {};       // {name: distance_from_home}

// ============================================================
//  MouseTool — 拉框/画圆
// ============================================================
var mouseTool = new AMap.MouseTool(map);

function activateMouseTool() {
  mouseTool.close(true);
  map.setStatus({ dragEnable: true });
  clearUserDraw();
  clearDistrictShapes();
  document.getElementById('drawHint').style.display = 'none';
  showCancel();
  if (mode === 'rect') {
    mouseTool.rectangle({ strokeColor: '#1677ff', strokeWeight: 3, strokeOpacity: .8, fillColor: '#1677ff', fillOpacity: .12 });
    document.getElementById('drawHint').style.display = 'block';
    document.getElementById('toast').textContent = '拉框模式：在地图上按住拖拽画矩形，松开完成。Esc取消';
  } else if (mode === 'circle') {
    mouseTool.circle({ strokeColor: '#1677ff', strokeWeight: 3, strokeOpacity: .8, fillColor: '#1677ff', fillOpacity: .12 });
    document.getElementById('drawHint').style.display = 'block';
    document.getElementById('toast').textContent = '画圆模式：在地图上按住拖拽画圆，松开完成。Esc取消';
  }
}

mouseTool.on('draw', function(e) {
  clearUserDraw();
  drawObj = e.obj;
  if (mode === 'rect') {
    drawBounds = e.obj.getBounds();
    document.getElementById('toast').textContent = '[OK] 矩形已画好 — 点"开始搜索"';
  } else {
    var c = e.obj.getCenter();
    drawCenter = [c.lng, c.lat];
    drawRadius = e.obj.getRadius();
    document.getElementById('toast').textContent = '[OK] 圆形已画好(约'+(drawRadius/1000).toFixed(1)+'km) — 点"开始搜索"';
  }
  mouseTool.close(false);
  map.setStatus({ dragEnable: true });
  document.getElementById('drawHint').style.display = 'none';
  hideCancel();
});

function haversine(lng1, lat1, lng2, lat2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// 获取搜索目标
// 根据 bounds 生成自适应网格搜索计划
function generateGridPlans(bounds, label) {
  var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  var RADIUS = 15000; // 15km
  var spacing = 2 * RADIUS * 0.7 / 111000; // 度数间距（重叠30%）
  var lngSpan = ne.lng - sw.lng;
  var latSpan = ne.lat - sw.lat;
  var cols = Math.max(1, Math.min(8, Math.ceil(lngSpan / spacing)));
  var rows = Math.max(1, Math.min(8, Math.ceil(latSpan / spacing)));
  var plans = [];
  var cellLng = cols > 1 ? lngSpan / cols : 0;
  var cellLat = rows > 1 ? latSpan / rows : 0;
  for (var ci = 0; ci < cols; ci++) {
    for (var ri = 0; ri < rows; ri++) {
      plans.push({
        label: label + (cols * rows > 1 ? '#' + (ci * rows + ri + 1) : ''),
        lng: sw.lng + cellLng * (ci + 0.5),
        lat: sw.lat + cellLat * (ri + 0.5),
        radius: RADIUS
      });
    }
  }
  return plans;
}

function getSearchTargets(callback) {
  if (mode === 'dist') {
    // 行政区模式
    var districts = getSelectedDistricts();
    if (!districts.length) {
      document.getElementById('toast').textContent = '请至少勾选一个区域';
      callback(null); return;
    }
    resolveDistricts(districts, callback);
  } else if (mode === 'rect') {
    if (!drawBounds) {
      document.getElementById('toast').textContent = '请先拉框画范围，再点搜索';
      callback(null); return;
    }
    callback([{ label: '矩形区域', bounds: drawBounds }]);
  } else if (mode === 'circle') {
    if (!drawCenter || !drawRadius) {
      document.getElementById('toast').textContent = '请先画圆，再点搜索';
      callback(null); return;
    }
    // 圆 → 取外接正方形
    var deg = drawRadius / 111000; // 米转度数（近似）
    var b = new AMap.Bounds(
      [drawCenter[0] - deg, drawCenter[1] - deg],
      [drawCenter[0] + deg, drawCenter[1] + deg]
    );
    callback([{ label: '圆形区域(' + (drawRadius / 1000).toFixed(1) + 'km)', bounds: b }]);
  } else if (mode === 'view') {
    var vb = map.getBounds();
    callback([{ label: '当前视野', bounds: vb }]);
  }
}

// 解析行政区：先用 DistrictSearch 拿边界，不行就用 Geocoder 定位中心
function resolveDistricts(districts, callback) {
  var results = [];
  var pending = districts.length;
  var hasFailure = false;

  districts.forEach(function(dist) {
    var fullName = dist.indexOf('青岛') === 0 ? dist : '青岛市' + dist;

    var done = false;
    var timeout = setTimeout(function() {
      if (done) return; done = true;
      // 超时 → 用 Geocoder 定位中心
      geocoder.getLocation(fullName, function(s, r) {
        if (s === 'complete' && r.info === 'OK' && r.geocodes.length > 0) {
          var loc = r.geocodes[0].location;
          // 给一个约 20km 的 bounds
          var deg = 0.18;
          results.push({
            label: dist,
            bounds: new AMap.Bounds([loc.lng - deg, loc.lat - deg], [loc.lng + deg, loc.lat + deg]),
            center: [loc.lng, loc.lat],
            approx: true
          });
        } else { hasFailure = true; }
        pending--;
        if (pending <= 0) finish();
      });
    }, 5000);

    if (typeof AMap.DistrictSearch !== 'function') {
      clearTimeout(timeout);
      // DistrictSearch 不可用，直接用 Geocoder 定位
      done = true;
      geocoder.getLocation(fullName, function(s, r) {
        if (s === 'complete' && r.info === 'OK' && r.geocodes.length > 0) {
          var loc = r.geocodes[0].location;
          results.push({ label: dist, bounds: new AMap.Bounds([loc.lng - 0.18, loc.lat - 0.18], [loc.lng + 0.18, loc.lat + 0.18]), approx: true });
        }
        pending--;
        if (pending <= 0) finish();
      });
      return;
    }

    var ds = null;
    try {
      ds = new AMap.DistrictSearch({ level: 'district', subdistrict: 0, extensions: 'all' });
    } catch(e) {
      clearTimeout(timeout); done = true;
      geocoder.getLocation(fullName, function(s, r) {
        if (s === 'complete' && r.info === 'OK' && r.geocodes.length > 0) {
          var loc = r.geocodes[0].location;
          results.push({ label: dist, bounds: new AMap.Bounds([loc.lng - 0.18, loc.lat - 0.18], [loc.lng + 0.18, loc.lat + 0.18]), approx: true });
        }
        pending--;
        if (pending <= 0) finish();
      });
      return;
    }

    ds.search(fullName, function(status, result) {
      if (done) return; done = true; clearTimeout(timeout);
      if (status === 'complete' && result.districtList && result.districtList.length > 0) {
        var d = result.districtList[0];
        var bds = d.boundaries;
        if (bds && bds[0] && bds[0].length > 10) {
          // 画行政区边界
          var pts = (typeof bds[0] === 'string' ? bds[0].split(';') : bds[0]);
          var ring = [];
          for (var j = 0; j < pts.length; j++) {
            var p = (typeof pts[j] === 'string' ? pts[j].split(',') : pts[j]);
            ring.push([parseFloat(p[0]), parseFloat(p[1])]);
          }
          var poly = new AMap.Polygon({
            path: ring, strokeColor: '#ff8c00', strokeWeight: 3, strokeOpacity: .7,
            fillColor: '#ff8c00', fillOpacity: .1
          });
          poly.setMap(map);
          distPolygons.push(poly);

          var bb = poly.getBounds();
          results.push({ label: dist, bounds: bb, polygon: poly });
          // 计算区中心到家的距离
          var c = bb.getCenter();
          homeDist[dist] = haversine(c.lng, c.lat, HLNG, HLAT);
        } else {
          hasFailure = true;
        }
      } else {
        hasFailure = true;
      }
      pending--;
      if (pending <= 0) finish();
    });
  });

  function finish() {
    if (results.length === 0) {
      document.getElementById('toast').textContent = '未能解析任何区域，请检查输入或用圈选模式';
      callback(null); return;
    }
    // 显示在地图上
    if (results.length === 1 && results[0].polygon) {
      map.setFitView([results[0].polygon], false, [60, 60, 450, 60]);
    } else if (results.length > 1) {
      // 合并所有 bounds
      var allLng = [], allLat = [];
      results.forEach(function(r) {
        allLng.push(r.bounds.southwest.lng, r.bounds.northeast.lng);
        allLat.push(r.bounds.southwest.lat, r.bounds.northeast.lat);
      });
      var merged = new AMap.Bounds(
        [Math.min.apply(null, allLng), Math.min.apply(null, allLat)],
        [Math.max.apply(null, allLng), Math.max.apply(null, allLat)]
      );
      map.setFitView([merged], false, [60, 60, 450, 60]);
    }
    callback(results);
  }
}

document.getElementById('btnGo').onclick = function() {
  if (isSearching) return;

  allResults = []; clearMarkers();
  document.getElementById('res').style.display = 'flex';
  document.getElementById('resList').innerHTML = '';

  document.getElementById('progFill').style.width = '0%';
  document.getElementById('progText').textContent = '正在规划搜索区域...';
  document.getElementById('btnCsv').disabled = true;
  showCancel();

  // 确定搜索中心+半径（不用 DistrictSearch，直接从地图状态算）
  var plans = [];
  var collectTimer = null;

  if (mode === 'dist') {
    // 行政区：用 JS API Geocoder 定位区中心
    var districts = getSelectedDistricts();
    if (!districts.length) {
      document.getElementById('toast').textContent = '请至少勾选一个区域'; searchDone(); return;
    }
    var searchStarted = false;
    function fireSearch(plans) {
      if (searchStarted) return;
      searchStarted = true;
      if (collectTimer) { clearTimeout(collectTimer); collectTimer = null; }
      // 去重（同一区可能多次定位）
      var seenLabels = {};
      plans = plans.filter(function(p) { if (seenLabels[p.label]) return false; seenLabels[p.label] = true; return true; });
      startSearch(plans);
    }
    var pending = districts.length;
    document.getElementById('progText').textContent = '正在定位 ' + pending + ' 个区域...';
    districts.forEach(function(d) {
      var fullName = '青岛市' + d;
      console.log('DEBUG Geocoder searching:', fullName);
      geocoder.getLocation(fullName, function(status, result) {
        console.log('DEBUG Geocoder cb:', d, 'status=' + status, result ? 'info=' + result.info : 'null');
        if (status === 'complete' && result.info === 'OK' && result.geocodes.length > 0) {
          var loc = result.geocodes[0].location;
          console.log('DEBUG Geocoder OK:', d, 'lng=' + loc.lng, 'lat=' + loc.lat, 'address=' + result.geocodes[0].formattedAddress);
          // 3×3 网格搜索，每个格点间距 0.11°（约12km），半径15km确保重叠覆盖
          if (!plans.some(function(p) { return p.label && p.label.indexOf(d) === 0; })) {
            var offsets = [-0.11, 0, 0.11];
            for (var gi = 0; gi < offsets.length; gi++) {
              for (var gj = 0; gj < offsets.length; gj++) {
                plans.push({
                  label: d + '#' + (gi*3+gj+1),
                  lng: loc.lng + offsets[gi],
                  lat: loc.lat + offsets[gj],
                  radius: 15000
                });
              }
            }
          }
          document.getElementById('toast').textContent = '已定位: ' + d;
        }
        pending--;
        if (pending <= 0) {
          if (plans.length === 0) {
            var c = map.getCenter();
            plans.push({label: '当前视野', lng: c.lng, lat: c.lat, radius: 20000});
          }
          fireSearch(plans);
        }
      });
    });
    // 10秒兜底（Geocoder 有时慢）
    collectTimer = setTimeout(function() {
      console.log('DEBUG Geocoder timeout fired, plans.length=' + plans.length + ' pending=' + pending);
      if (plans.length === 0) {
        var c = map.getCenter();
        plans.push({label: '当前视野(兜底)', lng: c.lng, lat: c.lat, radius: 20000});
      }
      fireSearch(plans);
    }, 10000);
    return;
  }

  if (mode === 'rect') {
    if (!drawBounds) { searchDone(); return; }
    plans = generateGridPlans(drawBounds, '矩形');
  } else if (mode === 'circle') {
    if (!drawCenter || !drawRadius) { searchDone(); return; }
    var deg2 = drawRadius / 111000;
    var b2 = new AMap.Bounds(
      [drawCenter[0] - deg2, drawCenter[1] - deg2],
      [drawCenter[0] + deg2, drawCenter[1] + deg2]
    );
    plans = generateGridPlans(b2, '圆形(' + (drawRadius / 1000).toFixed(1) + 'km)');
  } else if (mode === 'view') {
    plans = generateGridPlans(map.getBounds(), '视野');
  }
  // 限幅
  plans.forEach(function(p, i) {
    p.label = (p.label || 'search') + (plans.length > 1 ? '#' + (i+1) : '');
    p.radius = Math.min(50000, Math.max(1000, Math.round(p.radius)));
  });
  startSearch(plans);

  function startSearch(plans) {
    if (searchCancelled) { searchDone(); return; }
    if (!plans.length) { searchDone(); return; }
    plans = plans.filter(function(p, i) {
      return plans.findIndex(function(q) { return q.label === p.label; }) === i;
    });

    var WS_KEY = 'b756c2d47e44c7a36768bd8f2d2d7665';
    var PAGE_SIZE = 25, MAX_PAGES = 25, FETCH_DELAY = 300;
    var all = [], seen = {};
    var planIdx = 0, currentPage = 1, pagesNeeded = 1;
    var totalPagesEstimate = 0, pagesFetched = 0;
    var finished = false;
    var KEYWORDS = encodeURIComponent('公司|工厂|企业|科技|工程|制造|商贸|机械|物流');
	    var OVERFLOW_THRESHOLD = 800;
	    var MAX_SUBDIVIDE = 2;

    document.getElementById('toast').textContent = 'REST API 网格搜索 ' + plans.length + ' 点...';
    document.getElementById('progText').textContent = '查询中...';

    function fetchNextPage() {
      if (finished || searchCancelled || planIdx >= plans.length) {
        if (!finished) finishUp();
        return;
      }
      var plan = plans[planIdx];
      var url = 'https://restapi.amap.com/v3/place/around?key=' + WS_KEY +
        '&location=' + plan.lng.toFixed(6) + ',' + plan.lat.toFixed(6) +
        '&radius=' + plan.radius +
        '&keywords=' + KEYWORDS +
        '&offset=' + PAGE_SIZE + '&page=' + currentPage + '&extensions=all';

      console.log('REST fetch', plan.label, 'p' + currentPage, 'r=' + plan.radius);

      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        if (finished || searchCancelled) return;
        pagesFetched++;
        if (data.status === '1' && data.pois) {
          data.pois.forEach(function(poi) {
            var key = (poi.name || '') + '|' + (poi.address || '');
            if (!seen[key]) { seen[key] = true; all.push(poi); }
          });
        }
        if (currentPage === 1) {
          var count = parseInt(data.count) || 0;
          pagesNeeded = Math.min(Math.ceil(count / PAGE_SIZE), MAX_PAGES);
          totalPagesEstimate += pagesNeeded;

          // 四叉树溢出检测：结果数接近 API 上限 -> 裂变成 2x2 子网格
          var subLv = plan.level || 0;
          if (count >= OVERFLOW_THRESHOLD && subLv < MAX_SUBDIVIDE) {
            var nxtLv = subLv + 1;
            var subSpacing = 0.055 / nxtLv;
            var subRadius = Math.round(plan.radius / 2);
            var subOff = [-subSpacing, subSpacing];
            var added = 0;
            for (var si = 0; si < 2; si++) {
              for (var sj = 0; sj < 2; sj++) {
                plans.push({
                  label: plan.label + '.' + nxtLv + '.' + (si*2+sj+1),
                  lng: plan.lng + subOff[si],
                  lat: plan.lat + subOff[sj],
                  radius: subRadius,
                  level: nxtLv
                });
                added++;
              }
            }
            totalPagesEstimate += added;
            console.log('QuadSplit:', plan.label, 'count=' + count,
              '-> ' + added + ' sub-plans r=' + subRadius + 'm lv=' + nxtLv);
          }
        }
        var pct = totalPagesEstimate > 0 ? Math.round(Math.min(100, pagesFetched / Math.max(totalPagesEstimate, pagesFetched) * 100)) : 0;
        document.getElementById('progFill').style.width = pct + '%';
        document.getElementById('progText').textContent = pagesFetched + '/' + totalPagesEstimate + ' 页 ' + all.length + '家';
        document.getElementById('toast').textContent = plan.label + ' p' + currentPage + ' ' +
          (data.status === '1' ? 'OK' : 'err') + ' [' + all.length + ']';
        currentPage++;
        if (currentPage > pagesNeeded) { planIdx++; currentPage = 1; pagesNeeded = 1; }
        setTimeout(fetchNextPage, FETCH_DELAY);
      }).catch(function(err) {
        console.log('REST err:', err.message);
        pagesFetched++; currentPage++;
        if (currentPage > pagesNeeded) { planIdx++; currentPage = 1; pagesNeeded = 1; }
        setTimeout(fetchNextPage, FETCH_DELAY);
      });
    }
    fetchNextPage();

    var fallbackTimer = setTimeout(function() {
      if (!finished) { console.log('REST timeout'); finishUp(); }
    }, 120000);

    function finishUp() {
      if (finished) return; finished = true; clearTimeout(fallbackTimer);
      document.getElementById('progText').textContent = all.length + ' 家，打分...';
      var scored = [];
      var errCount = 0;
      var excluded = 0;
      for (var i = 0; i < all.length; i++) {
        try {
          var s = score(all[i]);
          if (s) scored.push(s); else excluded++;
        } catch(e) {
          errCount++;
          if (errCount <= 3) console.log('score error[' + i + ']:', e.message, JSON.stringify(all[i]).substring(0, 200));
        }
      }
      if (errCount) console.log('Total score errors:', errCount, '/', all.length);
      if (excluded) console.log('Excluded (个体户/工作室):', excluded);
      scored.sort(function(a, b) { return b.total - a.total; });
      allResults = scored;
      try {
        currentPageNum = 1;
        renderPage(1);
      } catch(e) {
        console.log('render error:', e.message);
        document.getElementById('resList').innerHTML = '<div style=\"padding:20px;color:red\">渲染错误: ' + e.message + '</div>';
      }
      document.getElementById('btnCsv').disabled = (scored.length === 0);
      document.getElementById('toast').textContent = scored.length ?
        '[OK] ' + scored.length + ' 家 | 综合排序 | 点击看详情' :
        '0结果 - REST API无返回';
      searchDone();
    }
  }
};

// ============================================================
//  打分
// ============================================================
function score(p) {
  // 归一化 REST API 数据：某些字段可能是数组而非字符串
  var n = (typeof p.name === 'string') ? p.name : '';
  var b = (typeof p.biz_type === 'string') ? p.biz_type : (Array.isArray(p.biz_type) ? p.biz_type.join(' ') : '');
  var c = (typeof p.type === 'string') ? p.type : (Array.isArray(p.type) ? p.type.join(' ') : '');
  var tel = (typeof p.tel === 'string') ? p.tel : (Array.isArray(p.tel) && p.tel.length > 0 ? String(p.tel[0]) : '');
  var web = (typeof p.website === 'string') ? p.website : (Array.isArray(p.website) && p.website.length > 0 ? String(p.website[0]) : '');
  var email = (typeof p.email === 'string') ? p.email : (Array.isArray(p.email) && p.email.length > 0 ? String(p.email[0]) : '');
  // rating 也可能是空数组
  var rt = '';
  if (p.biz_ext && p.biz_ext.rating) {
    rt = (typeof p.biz_ext.rating === 'string') ? p.biz_ext.rating : (Array.isArray(p.biz_ext.rating) ? '' : String(p.biz_ext.rating || ''));
  }
  // REST API 返回 "lng,lat" 字符串，JS API 返回 {lng,lat} 对象，统一处理
  var lng = null, lat = null;
  if (p.location) {
    if (typeof p.location === 'string') {
      var parts = p.location.split(',');
      lng = parseFloat(parts[0]); lat = parseFloat(parts[1]);
    } else {
      lng = p.location.lng; lat = p.location.lat;
    }
  }
  var t = (n + ' ' + b + ' ' + c).toLowerCase();

  // --- 距离 20% ---
  var ds = 50;
  var dkm = null;
  if (lng && lat) {
    dkm = haversine(lng, lat, HLNG, HLAT);
    if (dkm <= 3) ds = 100;
    else if (dkm <= 5) ds = 90;
    else if (dkm <= 7) ds = 80;
    else if (dkm <= 10) ds = 65;
    else if (dkm <= 15) ds = 50;
    else if (dkm <= 20) ds = 35;
    else if (dkm <= 30) ds = 20;
    else ds = 8;
  }

  // --- 企业性质 25% ---
  var ns = 30;  // 基础分
  var nature = '民营';
  if (/外商独资|外国法人独资|外商投资|^外资|外国/.test(n)) { ns += 60; nature = '外资'; }
  else if (/中外合资|合资/.test(n)) { ns += 50; nature = '合资'; }
  else if (/股份有限公司/.test(n)) { ns += 55; nature = '股份'; }
  else if (/有限责任公司/.test(n)) { ns += 40; nature = '民营'; }
  else if (/有限公司/.test(n)) { ns += 35; nature = '民营'; }
  else if (/有限合伙/.test(n)) { ns += 25; nature = '民营'; }
  else if (/集团/.test(n) && /控股/.test(n)) { ns += 45; nature = '股份'; }
  else if (/集团/.test(n)) { ns += 35; nature = '民营'; }
  else if (/个体工商户/.test(n) || /工作室/.test(n)) { return null; }
  else if (/公司/.test(n)) { ns += 30; nature = '民营'; }
  else { ns += 10; nature = '其他'; }

  // --- 规模推断 20% ---
  var ss = 20;
  if (/集团|控股/.test(n)) ss += 30;
  if (/股份/.test(n)) ss += 20;
  if (/分公司|子公司|分支机构/.test(n)) ss += 25;
  if (/连锁/.test(n)) ss += 15;
  // 高德评分
  if (rt) { var rf = parseFloat(rt); if (rf > 4.5) ss += 20; else if (rf > 4) ss += 15; else if (rf > 3.5) ss += 10; }

  // --- 福利推断 20% ---
  var ws = 20;
  if (nature === '外资') ws += 50;
  else if (nature === '股份') ws += 40;
  else if (nature === '合资') ws += 35;
  else if (nature === '民营') ws += 25;
  else ws += 10;
  if (tel) ws += 15;
  if (web) ws += 10;
  if (rt) { var rf2 = parseFloat(rt); if (rf2 > 4.5) ws += 12; else if (rf2 > 4) ws += 8; }

  // --- 联系方式 15% ---
  var cs = 10;
  if (tel) cs += 55;
  if (web) cs += 25;
  if (email) cs += 10;

  // --- 行业匹配（加分，不扣分）---
  var indBonus = 0;
  for (var i = 0; i < MATCH.length; i++) {
    if (t.indexOf(MATCH[i].toLowerCase()) >= 0) indBonus += 4;
  }
  indBonus = Math.min(20, indBonus);

  // 上限
  ns = Math.min(100, ns); ss = Math.min(100, ss);
  ws = Math.min(100, ws); cs = Math.min(100, cs); ds = Math.min(100, ds);

  var total = ns * 0.25 + ds * 0.20 + ss * 0.20 + ws * 0.20 + cs * 0.15 + indBonus;

  return {
    name: n,
  address: (typeof p.address === 'string' ? p.address : (typeof p.pname === 'string' ? p.pname : '')),
    nature: nature,
    total: Math.round(total * 10) / 10,
    natureScore: Math.round(ns),
    distanceScore: Math.round(ds),
    scaleScore: Math.round(ss),
    welfareScore: Math.round(ws),
    contactScore: Math.round(cs),
    phone: tel, website: web,
    lng: lng, lat: lat,
    distance: dkm,
    amapRating: rt
  };
}

function sortResults(by) {
  currentSort = by;
  var sorted = allResults.slice();
  if (by === 'total') sorted.sort(function(a, b) { return b.total - a.total; });
  else if (by === 'distanceScore') sorted.sort(function(a, b) { return b.distanceScore - a.distanceScore; });
  else if (by === 'scaleScore') sorted.sort(function(a, b) { return b.scaleScore - a.scaleScore; });
  else if (by === 'welfareScore') sorted.sort(function(a, b) { return b.welfareScore - a.welfareScore; });
  currentPageNum = 1;
  renderPage(1);
}

function clearMarkers() {
  markers.forEach(function(m) { map.remove(m); }); markers = [];

function addMarkers(results) {
  if (!showMarkers) { clearMarkers(); return; }
  clearMarkers();
  if (!results.length) return;
  var valid = results.filter(function(r) { return r.lng && r.lat; });
  if (!valid.length) return;

  var lngs = [], lats = [];
  valid.forEach(function(r, i) {
    lngs.push(r.lng); lats.push(r.lat);
    var color = r.total >= 70 ? '#52c41a' : (r.total >= 50 ? '#faad14' : '#ff4d4f');
    var m = new AMap.Marker({
      position: [r.lng, r.lat],
      label: {
        content: '<span style="display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;background:' +
          color + ';color:#fff;border-radius:10px;font-size:10px;font-weight:bold;padding:0 4px">' + (i + 1) + '</span>',
        offset: new AMap.Pixel(-10, -10)
      },
      zIndex: 300 - i
    });
    m.on('click', (function(rr, col) {
      return function() {
        new AMap.InfoWindow({
          content: '<div style="font-size:12px;max-width:280px"><strong>' + esc(rr.name) +
            '</strong> <span style="background:' + col + ';color:#fff;padding:1px 6px;border-radius:3px;font-size:11px">' +
            rr.total + '分</span><br>' + esc(rr.address || '') + '<br>' +
            rr.nature + ' | ' + (rr.distance ? rr.distance.toFixed(1) + 'km' : '--') +
            (rr.phone ? ' | ' + rr.phone : '') + '</div>',
          offset: new AMap.Pixel(0, -30)
        }).open(map, m.getPosition());
      };
    })(r, color));
    m.setMap(map); markers.push(m);
  });

  map.setFitView(null, false, [60, 60, 450, 60]);
}

// ============================================================
//  分页
// ============================================================
function getCurrentPage() {
  var start = (currentPageNum - 1) * PAGE_SIZE_DISPLAY;
  return allResults.slice(start, start + PAGE_SIZE_DISPLAY);
}

function renderPage(pageNum) {
  var totalPages = Math.ceil(allResults.length / PAGE_SIZE_DISPLAY);
  if (totalPages < 1) totalPages = 1;
  if (pageNum > totalPages) pageNum = totalPages;
  if (pageNum < 1) pageNum = 1;
  currentPageNum = pageNum;

  var pageData = getCurrentPage();
  renderList(pageData, (pageNum - 1) * PAGE_SIZE_DISPLAY);
  renderPagination();
  if (showMarkers) { addMarkers(getCurrentPage()); } else { clearMarkers(); }
}

function renderPagination() {
  var totalPages = Math.ceil(allResults.length / PAGE_SIZE_DISPLAY);
  var el = document.getElementById('pagination');
  if (totalPages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.className = 'pager';

  var html = '';
  html += '<button ' + (currentPageNum <= 1 ? 'disabled' : 'onclick="renderPage(' + (currentPageNum - 1) + ')"') + '>&lt;</button>';

  var startP = Math.max(1, currentPageNum - 3);
  var endP = Math.min(totalPages, currentPageNum + 3);
  if (startP > 1) {
    html += '<button onclick="renderPage(1)">1</button>';
    if (startP > 2) html += '<span class="pg-info">...</span>';
  }
  for (var p = startP; p <= endP; p++) {
    html += '<button class="' + (p === currentPageNum ? 'on' : '') + '" onclick="renderPage(' + p + ')">' + p + '</button>';
  }
  if (endP < totalPages) {
    if (endP < totalPages - 1) html += '<span class="pg-info">...</span>';
    html += '<button onclick="renderPage(' + totalPages + ')">' + totalPages + '</button>';
  }

  html += '<button ' + (currentPageNum >= totalPages ? 'disabled' : 'onclick="renderPage(' + (currentPageNum + 1) + ')"') + '>&gt;</button>';
  html += '<span class="pg-info">共 ' + allResults.length + ' 条</span>';

  el.innerHTML = html;
}

// ============================================================
//  CSV
// ============================================================
document.getElementById('btnCsv').onclick = function() {
  if (!allResults.length) return;
  function safeStr(v) { return String(v || '').replace(/"/g, '""'); }
  var rows = ['﻿排名,总分,公司名,企业性质,地址,距离(km),企业性质分,规模分,福利分,距离分,联系方式分,电话,官网'];
  for (var i = 0; i < allResults.length; i++) {
    var r = allResults[i];
    rows.push([
      i + 1, r.total,
      '"' + safeStr(r.name) + '"',
      r.nature,
      '"' + safeStr(r.address) + '"',
      r.distance !== null ? r.distance.toFixed(1) : '',
      r.natureScore, r.scaleScore, r.welfareScore, r.distanceScore, r.contactScore,
      r.phone || '', r.website || ''
    ].join(','));
  }
  var blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var dt = new Date();
  a.download = 'companies_' + dt.getFullYear() +
    ('0' + (dt.getMonth() + 1)).slice(-2) +
    ('0' + dt.getDate()).slice(-2) + '_' +
    ('0' + dt.getHours()).slice(-2) +
    ('0' + dt.getMinutes()).slice(-2) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  document.getElementById('toast').textContent = '[OK] CSV已导出: ' + allResults.length + ' 家公司';
};

function toggleSave(btn, name, addr) {
  var r = allResults.find(function(x) { return x.name === name && x.address === addr; });
  if (!r) return;
  if (isSaved(r)) {
    removeSaved(r);
    btn.classList.remove('on');
    btn.textContent = '☆';
  } else {
    saveCompany(r);
    btn.classList.add('on');
    btn.textContent = '★';
  }
  renderSavedPanel();
}

function esc(s) {
  if (typeof s !== 'string') s = (s === null || s === undefined) ? '' : String(s);
  return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
}

// ============================================================
//  按 Enter 也开始搜索
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !isSearching && document.activeElement === document.body) {
    document.getElementById('btnGo').click();
  }
});
</script>
